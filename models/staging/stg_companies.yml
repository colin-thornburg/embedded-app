models:
  - name: stg_companies
    columns:
      - name: company_id
        data_tests:
          - unique
          - not_null
      - name: company_name
        data_tests:
          - not_null
      - name: industry
      - name: employee_count
      - name: primary_plan_type
      - name: logo_url
      - name: brand_color
      - name: loaded_at
        data_tests:
          - not_null