models:
- name: dim_plans
  description: This model provides a comprehensive view of insurance plans, including
    details about the plan's deductible, out-of-pocket maximums, premiums, and copayments.
    It also includes the company offering the plan, allowing for analysis of plan
    offerings across different companies.
  columns:
  - name: plan_id
    description: A unique identifier for each insurance plan.
  - name: company_id
    description: A unique identifier for the company offering the plan.
  - name: plan_name
    description: The name of the insurance plan.
  - name: plan_type
    description: The type of insurance plan, such as HMO or PPO.
  - name: annual_deductible_individual
    description: The annual deductible amount for an individual under the plan.
  - name: annual_deductible_family
    description: The annual deductible amount for a family under the plan.
  - name: oop_max_individual
    description: The maximum out-of-pocket expense for an individual under the plan.
  - name: oop_max_family
    description: The maximum out-of-pocket expense for a family under the plan.
  - name: premium_monthly_employee
    description: The monthly premium cost for an employee under the plan.
  - name: premium_monthly_family
    description: The monthly premium cost for a family under the plan.
  - name: coinsurance_percentage
    description: The percentage of costs covered by the insurance after the deductible
      is met.
  - name: copay_primary
    description: The copayment amount for visiting a primary care physician.
  - name: copay_specialist
    description: The copayment amount for visiting a specialist.
  - name: copay_emergency
    description: The copayment amount for emergency room visits.
  - name: prescription_coverage
    description: Indicates whether the plan includes prescription drug coverage.
  - name: company_name
    description: The name of the company offering the insurance plan.
