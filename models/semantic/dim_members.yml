models:
- name: dim_members
  description: This model provides a comprehensive view of members, including personal
    details, company affiliation, and plan information. It is useful for analyzing
    member demographics, company distribution, and plan enrollment.
  columns:
  - name: member_id
    description: A unique identifier for each member.
  - name: company_id
    description: The identifier for the company the member is associated with.
  - name: employee_id
    description: The employee identifier within the company.
  - name: first_name
    description: The first name of the member.
  - name: last_name
    description: The last name of the member.
  - name: email
    description: The email address of the member.
  - name: date_of_birth
    description: The birth date of the member.
  - name: gender
    description: The gender of the member.
  - name: plan_id
    description: The identifier for the plan the member is enrolled in.
  - name: enrollment_date
    description: The date when the member enrolled in the plan.
  - name: is_primary
    description: Indicates if the member is the primary account holder.
  - name: dependent_of
    description: The member_id of the primary account holder if the member is a dependent.
  - name: department
    description: The department where the member works.
  - name: annual_salary
    description: The annual salary of the member.
  - name: plan_name
    description: The name of the plan the member is enrolled in.
  - name: plan_type
    description: The type of plan the member is enrolled in.
  - name: company_name
    description: The name of the company the member is associated with.
  - name: industry
    description: The industry in which the company operates.
  - name: brand_color
    description: The brand color associated with the company.
