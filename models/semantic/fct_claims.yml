models:
- name: fct_claims
  description: This model consolidates claim data by joining claims, members, and
    plans information. It provides a comprehensive view of each claim, including details
    about the member, the plan, and the claim specifics such as type, amount, and
    status. This model is useful for analyzing claim trends, member responsibilities,
    and financial metrics related to claims.
  columns:
  - name: claim_id
    description: A unique identifier for each claim.
  - name: member_id
    description: A unique identifier for the member associated with the claim.
  - name: company_id
    description: A unique identifier for the company handling the claim.
  - name: claim_date
    description: The date on which the claim was filed.
  - name: claim_type
    description: The type of claim, indicating the nature of the service or product
      claimed.
  - name: provider_name
    description: The name of the healthcare provider associated with the claim.
  - name: diagnosis_code
    description: A code representing the diagnosis related to the claim.
  - name: diagnosis_description
    description: A description of the diagnosis related to the claim.
  - name: claim_amount
    description: The total amount claimed for the service or product.
  - name: paid_amount
    description: The amount paid by the insurance for the claim.
  - name: member_responsibility
    description: The amount the member is responsible for paying.
  - name: claim_status
    description: The current status of the claim, such as pending, approved, or denied.
  - name: service_date
    description: The date on which the service was provided.
  - name: claim_year
    description: The year in which the claim was filed.
  - name: claim_month
    description: The month in which the claim was filed.
  - name: plan_id
    description: A unique identifier for the plan associated with the member.
  - name: department
    description: The department within the company handling the claim.
  - name: plan_type
    description: The type of plan under which the claim is filed.
